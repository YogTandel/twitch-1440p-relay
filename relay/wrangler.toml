name = "twitch-relay"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Run the Worker near a US cloud region, so Twitch sees a US IP
# when issuing the playback token.
[placement]
region = "aws:us-east-1"

# Store invocation + console logs so they are visible in the dashboard
# (Workers & Pages -> twitch-relay -> Observability).
[observability]
enabled = true
head_sampling_rate = 1
